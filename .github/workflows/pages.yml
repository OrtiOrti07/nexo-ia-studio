# Publica la web en GitHub Pages cada vez que se sube un cambio a main.
#
# GitHub Pages solo sirve archivos estáticos, así que:
# - se compila con NEXT_PUBLIC_STATIC_EXPORT=1 (carpeta out/);
# - se quita la ruta /api/contact (necesita servidor). El formulario ofrece
#   enviar el mensaje por correo o usa NEXT_PUBLIC_CONTACT_ENDPOINT si existe
#   (variable del repositorio: Settings → Secrets and variables → Actions → Variables).

name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - id: pages
        uses: actions/configure-pages@v6

      - name: Instalar dependencias
        run: npm ci

      - name: Quitar la API (GitHub Pages no ejecuta código de servidor)
        run: rm -rf src/app/api

      - name: Compilar la web estática
        run: npm run build
        env:
          NEXT_PUBLIC_STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_PUBLIC_CONTACT_ENDPOINT: ${{ vars.NEXT_PUBLIC_CONTACT_ENDPOINT }}

      - name: Desactivar Jekyll (para servir la carpeta _next)
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
